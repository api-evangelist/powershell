- aid: powershell:powershell-runspace-api
  name: PowerShell Runspace API
  description: >-
    .NET APIs for creating, configuring, and managing PowerShell runspaces from host applications. Enables
    embedding PowerShell execution inside .NET programs.
  humanURL: https://docs.microsoft.com/en-us/dotnet/api/system.management.automation.runspaces
  tags:
  - Automation
  - .NET
  - Runspace
  - SDK
  properties:
