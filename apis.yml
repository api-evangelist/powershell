aid: powershell
name: PowerShell
description: >-
  PowerShell is a cross-platform task automation solution made up of a
  command-line shell, a scripting language, and a configuration
  management framework. The PowerShell ecosystem exposes APIs through
  the PowerShell Gallery (an OData-based package repository), the
  Runspace .NET hosting APIs, and PowerShell Remoting protocols
  (WS-Management and SSH).
