    url: >-
      https://docs.microsoft.com/en-us/powershell/scripting/developer/hosting/creating-runspaces
  - type: SDKs
    url: https://www.nuget.org/packages/System.Management.Automation/
  - type: Examples
    url: https://github.com/PowerShell/PowerShell/tree/master/test/hosting
- aid: powershell:powershell-remoting-api
  name: PowerShell Remoting API
  description: >-
    APIs and protocols for remote PowerShell execution over WS-Management (WinRM) and SSH. Enables one-to-one
    and one-to-many remote command and session management.
  humanURL: >-
    https://docs.microsoft.com/en-us/powershell/scripting/learn/remoting/running-remote-commands
  tags:
  - Remoting
  - SSH
  - WinRM
  - WS-Management
  properties:
